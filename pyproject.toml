[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-recon"
version = "1.1.0"
description = "🔥 Phantom Recon — Advanced Penetration Testing & Reconnaissance Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Tahir", email = "tahir@example.com"},
]
keywords = [
    "pentest", "penetration-testing", "security", "reconnaissance",
    "network-scanner", "vulnerability", "ethical-hacking", "cybersecurity",
    "infosec", "red-team"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
    "python-nmap>=0.7.1",
    "scapy>=2.5.0",
    "colorama>=0.4.6",
    "rich>=13.7.0",
    "click>=8.1.7",
    "dnspython>=2.4.2",
    "python-whois>=0.9.4",
    "paramiko>=3.4.0",
    "cryptography>=41.0.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
phantom = "phantom_recon.cli:main"

[project.urls]
Homepage = "https://github.com/tahir/phantom-recon"
Documentation = "https://github.com/tahir/phantom-recon#readme"
Repository = "https://github.com/tahir/phantom-recon"
"Bug Tracker" = "https://github.com/tahir/phantom-recon/issues"

[tool.setuptools.packages.find]
include = ["phantom_recon*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
